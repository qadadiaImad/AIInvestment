<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized hero background: dusk over the White House south portico, the
       flag streaming across the sky like a soaring eagle's wing. Flat-vector
       look matched to slides/theme.ts palette. Placeholder-grade: swap this
       file (or point bgSrc at a PNG) for a photoreal generated background. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06080e"/>
      <stop offset="0.42" stop-color="#0e1830"/>
      <stop offset="0.72" stop-color="#1d2742"/>
      <stop offset="0.88" stop-color="#4a3a26"/>
      <stop offset="1" stop-color="#6b4e22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A23B" stop-opacity="0"/>
      <stop offset="1" stop-color="#E0A23B" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1410"/>
      <stop offset="1" stop-color="#060a08"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8EDF2" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#E8EDF2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8EDF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#sky)"/>
  <rect y="760" width="1080" height="240" fill="url(#glow)"/>

  <!-- moon halo -->
  <circle cx="905" cy="150" r="120" fill="url(#moon)" opacity="0.5"/>
  <circle cx="905" cy="150" r="34" fill="#E8EDF2" opacity="0.85"/>

  <!-- stars -->
  <g fill="#E8EDF2">
    <circle cx="90" cy="120" r="2.6" opacity="0.7"/>
    <circle cx="210" cy="70" r="1.8" opacity="0.5"/>
    <circle cx="330" cy="170" r="2.2" opacity="0.6"/>
    <circle cx="470" cy="90" r="1.6" opacity="0.45"/>
    <circle cx="610" cy="150" r="2.4" opacity="0.6"/>
    <circle cx="740" cy="60" r="1.7" opacity="0.5"/>
    <circle cx="160" cy="300" r="1.9" opacity="0.45"/>
    <circle cx="560" cy="260" r="1.6" opacity="0.4"/>
    <circle cx="1010" cy="320" r="2.1" opacity="0.5"/>
    <circle cx="60" cy="500" r="1.8" opacity="0.35"/>
    <circle cx="990" cy="520" r="1.7" opacity="0.35"/>
  </g>

  <!-- ======== the flag, streaming like a wing ======== -->
  <!-- faint echo wing beneath (wingbeat feel) -->
  <g fill="none" stroke-linecap="round" opacity="0.22">
    <path d="M150,700 C400,640 640,660 960,430" stroke="#C25E5E" stroke-width="16"/>
    <path d="M150,722 C400,662 640,682 940,462" stroke="#E8EDF2" stroke-width="16"/>
    <path d="M150,744 C400,684 620,704 900,506" stroke="#C25E5E" stroke-width="16"/>
  </g>

  <!-- main banner: wavy stripes fanning to feathered tips, arcing upward -->
  <g fill="none" stroke-linecap="round">
    <path d="M140,560 C360,430 600,470 1000,190" stroke="#E0524D" stroke-width="24"/>
    <path d="M142,584 C364,454 604,494 990,220" stroke="#E8EDF2" stroke-width="24"/>
    <path d="M144,608 C368,478 608,518 1006,242" stroke="#E0524D" stroke-width="24"/>
    <path d="M146,632 C372,502 612,542 972,286" stroke="#E8EDF2" stroke-width="24"/>
    <path d="M148,656 C376,526 616,566 990,300" stroke="#E0524D" stroke-width="24"/>
    <path d="M150,680 C380,550 620,590 940,352" stroke="#E8EDF2" stroke-width="24"/>
    <path d="M152,704 C384,574 624,614 950,368" stroke="#E0524D" stroke-width="24"/>
  </g>

  <!-- canton with stars, at the hoist -->
  <g transform="translate(96,528) rotate(-26)">
    <rect x="0" y="0" width="230" height="150" rx="18" fill="#1c2c55"/>
    <g fill="#E8EDF2">
      <circle cx="34" cy="34" r="6"/><circle cx="86" cy="34" r="6"/><circle cx="138" cy="34" r="6"/><circle cx="190" cy="34" r="6"/>
      <circle cx="60" cy="72" r="6"/><circle cx="112" cy="72" r="6"/><circle cx="164" cy="72" r="6"/>
      <circle cx="34" cy="110" r="6"/><circle cx="86" cy="110" r="6"/><circle cx="138" cy="110" r="6"/><circle cx="190" cy="110" r="6"/>
    </g>
  </g>

  <!-- ======== ground & the south portico silhouette ======== -->
  <rect y="952" width="1080" height="398" fill="url(#lawn)"/>

  <!-- flanking trees -->
  <g fill="#04060a">
    <ellipse cx="120" cy="930" rx="150" ry="90"/>
    <ellipse cx="30" cy="960" rx="130" ry="80"/>
    <ellipse cx="960" cy="925" rx="160" ry="95"/>
    <ellipse cx="1060" cy="960" rx="120" ry="75"/>
  </g>

  <!-- building mass -->
  <g>
    <rect x="250" y="770" width="580" height="190" fill="#05070c"/>
    <!-- curved portico (the Oval Office bow) -->
    <path d="M420,960 L420,800 A120,95 0 0 1 660,800 L660,960 Z" fill="#04060a"/>
    <!-- portico roof cap -->
    <path d="M405,802 A135,60 0 0 1 675,802 L675,816 L405,816 Z" fill="#070a12"/>
    <!-- columns -->
    <g fill="#0d1220">
      <rect x="438" y="816" width="14" height="132"/>
      <rect x="478" y="810" width="14" height="140"/>
      <rect x="518" y="807" width="14" height="143"/>
      <rect x="548" y="807" width="14" height="143"/>
      <rect x="588" y="810" width="14" height="140"/>
      <rect x="628" y="816" width="14" height="132"/>
    </g>
    <!-- roof balustrade -->
    <rect x="250" y="758" width="580" height="14" fill="#070a12"/>
    <g fill="#070a12">
      <rect x="262" y="746" width="8" height="12"/><rect x="292" y="746" width="8" height="12"/>
      <rect x="322" y="746" width="8" height="12"/><rect x="352" y="746" width="8" height="12"/>
      <rect x="382" y="746" width="8" height="12"/><rect x="700" y="746" width="8" height="12"/>
      <rect x="730" y="746" width="8" height="12"/><rect x="760" y="746" width="8" height="12"/>
      <rect x="790" y="746" width="8" height="12"/><rect x="818" y="746" width="8" height="12"/>
    </g>
    <!-- warm windows -->
    <g fill="#E0A23B" opacity="0.5">
      <rect x="286" y="812" width="18" height="30" rx="2"/>
      <rect x="330" y="812" width="18" height="30" rx="2"/>
      <rect x="374" y="812" width="18" height="30" rx="2"/>
      <rect x="690" y="812" width="18" height="30" rx="2"/>
      <rect x="734" y="812" width="18" height="30" rx="2"/>
      <rect x="778" y="812" width="18" height="30" rx="2"/>
      <rect x="286" y="880" width="18" height="34" rx="2"/>
      <rect x="330" y="880" width="18" height="34" rx="2"/>
      <rect x="690" y="880" width="18" height="34" rx="2"/>
      <rect x="734" y="880" width="18" height="34" rx="2"/>
      <rect x="527" y="852" width="26" height="52" rx="3" opacity="0.8"/>
    </g>
  </g>

  <!-- fountain glow on the lawn -->
  <ellipse cx="540" cy="1060" rx="240" ry="34" fill="#E0A23B" opacity="0.07"/>
  <ellipse cx="540" cy="1060" rx="120" ry="18" fill="#E0A23B" opacity="0.08"/>
</svg>
