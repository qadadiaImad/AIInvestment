<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5A6472" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5A6472" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#0A0D12"/>

  <!-- Kicker -->
  <text x="80" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-weight="600" font-size="24" fill="#34D399" letter-spacing="4">IONQ  ·  PRICE vs ANALYST TARGETS</text>

  <!-- Title -->
  <text x="80" y="240" font-family="'Fraunces','Georgia',serif" font-weight="600" font-size="58" fill="#E8EDF2" letter-spacing="-1">IonQ — share price vs</text>
  <text x="80" y="308" font-family="'Fraunces','Georgia',serif" font-weight="600" font-size="58" fill="#E8EDF2" letter-spacing="-1">analysts' target band</text>

  <!-- Note -->
  <text x="80" y="360" font-family="'Inter','Helvetica','Arial',sans-serif" font-size="28" fill="#8A95A5">price now ≈ analysts' average — but the range runs</text>
  <text x="80" y="398" font-family="'Inter','Helvetica','Arial',sans-serif" font-size="28" fill="#8A95A5">from <tspan font-weight="700" fill="#C2CAD6">$35</tspan> to <tspan font-weight="700" fill="#C2CAD6">$100</tspan></text>

  <!-- Chart (translated to fit 1080-wide canvas; original viewBox 0 0 940 560) -->
  <g transform="translate(70 460) scale(1.0)">
    <!-- analyst high target band -->
    <line x1="12" y1="62" x2="874" y2="62" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 9" opacity=".55"/>
    <text x="876" y="68" fill="#38BDF8" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" font-weight="700">HIGH $100</text>

    <!-- analyst average target -->
    <line x1="12" y1="226" x2="874" y2="226" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2 9" opacity=".70"/>
    <text x="876" y="232" fill="#34D399" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" font-weight="700">AVG  $68</text>

    <!-- analyst low target -->
    <line x1="12" y1="385" x2="874" y2="385" stroke="#B4690E" stroke-width="1.5" stroke-dasharray="2 9" opacity=".55"/>
    <text x="876" y="391" fill="#B4690E" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" font-weight="700">LOW  $35</text>

    <!-- price area -->
    <path d="M 12,413 L 80,429 L 148,410 L 216,386 L 284,361 L 352,351 L 420,336 L 488,351 L 556,370 L 625,340 L 642,300 L 695,261 L 750,142 L 800,204 L 850,221 L 850,528 L 12,528 Z" fill="url(#ar)"/>

    <!-- price line -->
    <path d="M 12,413 L 80,429 L 148,410 L 216,386 L 284,361 L 352,351 L 420,336 L 488,351 L 556,370 L 625,340 L 642,300 L 695,261 L 750,142 L 800,204 L 850,221" fill="none" stroke="#AEB8C6" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- DARPA marker -->
    <line x1="635" y1="40" x2="635" y2="528" stroke="#2A3340" stroke-width="1.5" stroke-dasharray="3 6"/>
    <text x="640" y="120" fill="#5A6472" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15">DARPA HARQ — Apr 14</text>

    <!-- current price marker -->
    <circle cx="850" cy="221" r="9" fill="#AEB8C6"/>
    <text x="876" y="40" fill="#AEB8C6" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-weight="700" font-size="26" text-anchor="end">PRICE  $68</text>

    <!-- x-axis month labels -->
    <text x="30" y="554" fill="#5A6472" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15" text-anchor="middle">Jul 25</text>
    <text x="284" y="554" fill="#5A6472" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15" text-anchor="middle">Nov 25</text>
    <text x="488" y="554" fill="#5A6472" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15" text-anchor="middle">Feb 26</text>
    <text x="695" y="554" fill="#5A6472" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15" text-anchor="middle">May 26</text>
    <text x="838" y="554" fill="#5A6472" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15" text-anchor="middle">Jun 26</text>
  </g>

  <!-- Legend -->
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="23" fill="#C2CAD6">
    <rect x="80" y="1100" width="30" height="5" rx="2" fill="#AEB8C6"/>
    <text x="120" y="1108">Share price</text>
    <rect x="320" y="1100" width="30" height="5" rx="2" fill="#34D399"/>
    <text x="360" y="1108">Analyst avg target</text>
    <rect x="660" y="1100" width="30" height="5" rx="2" fill="#38BDF8"/>
    <text x="700" y="1108">High / low band</text>
  </g>

  <!-- Footer -->
  <text x="80" y="1230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" fill="#5A6472" letter-spacing="0.5">price 52w range $25.89–$84.64 · 13 analysts polled · stamped 03 Jun 2026 · NFA</text>
</svg>
