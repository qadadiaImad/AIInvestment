<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IONQ — Slide 2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden}
.dk{background:#0A0D12;color:#E8EDF2;font-family:Inter}
.pad{position:relative;padding:90px 80px;height:100%;display:flex;flex-direction:column}
.kick{font-family:'JetBrains Mono';font-weight:600;font-size:24px;letter-spacing:4px;color:#34D399}
.title{font-family:Fraunces;font-weight:600;font-size:58px;line-height:1.05;letter-spacing:-1px;margin-top:18px}
.note{font-size:28px;color:#8A95A5;margin-top:10px}
.legend{display:flex;gap:34px;font-family:'JetBrains Mono';font-size:23px;margin:16px 4px 0;color:#C2CAD6}
.legend i{display:inline-block;width:30px;height:5px;border-radius:3px;margin-right:12px;vertical-align:middle}
.foot{font-family:'JetBrains Mono';font-size:18px;color:#5A6472;letter-spacing:.5px}
.chartwrap{flex:1;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>
<div class="slide dk">
  <div class="pad">
    <div class="kick">IONQ &nbsp;·&nbsp; PRICE vs ANALYST TARGETS</div>
    <div class="title">IonQ &mdash; share price vs<br>analysts' target band</div>
    <div class="note">price now &asymp; analysts' average &mdash; but the range runs from <b>$35</b> to <b>$100</b></div>
    <div class="chartwrap">
      <svg viewBox="0 0 940 560" width="100%">
        <defs>
          <linearGradient id="ar" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#5A6472" stop-opacity=".28"/>
            <stop offset="1" stop-color="#5A6472" stop-opacity="0"/>
          </linearGradient>
          <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- analyst high target band -->
        <line x1="12" y1="62" x2="874" y2="62" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 9" opacity=".55"/>
        <text x="876" y="68" fill="#38BDF8" font-family="JetBrains Mono" font-size="18" font-weight="700">HIGH $100</text>

        <!-- analyst average target -->
        <line x1="12" y1="226" x2="874" y2="226" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2 9" opacity=".70"/>
        <text x="876" y="232" fill="#34D399" font-family="JetBrains Mono" font-size="18" font-weight="700">AVG  $68</text>

        <!-- analyst low target -->
        <line x1="12" y1="385" x2="874" y2="385" stroke="#B4690E" stroke-width="1.5" stroke-dasharray="2 9" opacity=".55"/>
        <text x="876" y="391" fill="#B4690E" font-family="JetBrains Mono" font-size="18" font-weight="700">LOW  $35</text>

        <!-- price area (synthesized monthly closes; anchors: 52w low Aug 25 ~$26, DARPA spike Apr 14 from ~$44 to ~$52, 52w high May 26 $84, current Jun 3 $68) -->
        <path d="M 12,413 L 80,429 L 148,410 L 216,386 L 284,361 L 352,351 L 420,336 L 488,351 L 556,370 L 625,340 L 642,300 L 695,261 L 750,142 L 800,204 L 850,221 L 850,528 L 12,528 Z" fill="url(#ar)"/>

        <!-- price line -->
        <path d="M 12,413 L 80,429 L 148,410 L 216,386 L 284,361 L 352,351 L 420,336 L 488,351 L 556,370 L 625,340 L 642,300 L 695,261 L 750,142 L 800,204 L 850,221" fill="none" stroke="#AEB8C6" stroke-width="3.5" stroke-linejoin="round"/>

        <!-- DARPA marker -->
        <line x1="635" y1="40" x2="635" y2="528" stroke="#2A3340" stroke-width="1.5" stroke-dasharray="3 6"/>
        <text x="640" y="120" fill="#5A6472" font-family="JetBrains Mono" font-size="15">DARPA HARQ &mdash; Apr 14</text>

        <!-- current price marker -->
        <circle cx="850" cy="221" r="9" fill="#AEB8C6"/>
        <text x="876" y="40" fill="#AEB8C6" font-family="JetBrains Mono" font-weight="700" font-size="26" text-anchor="end">PRICE  $68</text>

        <!-- x-axis month labels (aligned to path waypoints) -->
        <text x="30" y="554" fill="#5A6472" font-family="JetBrains Mono" font-size="15" text-anchor="middle">Jul 25</text>
        <text x="284" y="554" fill="#5A6472" font-family="JetBrains Mono" font-size="15" text-anchor="middle">Nov 25</text>
        <text x="488" y="554" fill="#5A6472" font-family="JetBrains Mono" font-size="15" text-anchor="middle">Feb 26</text>
        <text x="695" y="554" fill="#5A6472" font-family="JetBrains Mono" font-size="15" text-anchor="middle">May 26</text>
        <text x="838" y="554" fill="#5A6472" font-family="JetBrains Mono" font-size="15" text-anchor="middle">Jun 26</text>
      </svg>
      <div class="legend">
        <span><i style="background:#AEB8C6"></i>Share price</span>
        <span><i style="background:#34D399"></i>Analyst avg target</span>
        <span><i style="background:#38BDF8"></i>High / low band</span>
      </div>
    </div>
    <div class="foot" style="margin-top:24px">price 52w range $25.89&ndash;$84.64 · 13 analysts polled · stamped 03 Jun 2026 · NFA</div>
  </div>
</div>
</body>
</html>
