*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;overflow:hidden;}
body{font-family:'Inter',sans-serif;position:relative;background:#0A0D12;color:#E8EDF2;}
svg.art{position:absolute;inset:0;display:block;}
