<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0A0D12;color:#E8EDF2;font-family:'Inter',sans-serif}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(232,237,242,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,237,242,.03) 1px,transparent 1px);background-size:40px 40px}
.mono{font-family:'JetBrains Mono',monospace}
</style></head><body><div class="slide">
  <div class="grid"></div>
  <svg width="1080" height="1350" viewBox="0 0 1080 1350" style="position:absolute;inset:0">
    <defs>
      <radialGradient id="glowE" cx="50%" cy="42%" r="55%">
        <stop offset="0" stop-color="#10B981" stop-opacity=".28"/>
        <stop offset=".6" stop-color="#10B981" stop-opacity=".07"/>
        <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowC" cx="24%" cy="18%" r="45%">
        <stop offset="0" stop-color="#22D3EE" stop-opacity=".14"/>
        <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="ion" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ECFDF5" stop-opacity="1"/>
        <stop offset=".25" stop-color="#34D399" stop-opacity=".95"/>
        <stop offset=".6" stop-color="#10B981" stop-opacity=".35"/>
        <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="ionC" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#F0FDFF" stop-opacity="1"/>
        <stop offset=".25" stop-color="#22D3EE" stop-opacity=".9"/>
        <stop offset=".6" stop-color="#22D3EE" stop-opacity=".3"/>
        <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1080" height="1350" fill="url(#glowE)"/>
    <rect width="1080" height="1350" fill="url(#glowC)"/>

    <!-- interference rings, centered on the trap axis -->
    <g fill="none" stroke="#34D399" opacity=".9">
      <circle cx="540" cy="560" r="90"  stroke-opacity=".22" stroke-width="1.4"/>
      <circle cx="540" cy="560" r="150" stroke-opacity=".15" stroke-width="1.2"/>
      <circle cx="540" cy="560" r="220" stroke-opacity=".10" stroke-width="1.1"/>
      <circle cx="540" cy="560" r="300" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="540" cy="560" r="390" stroke-opacity=".05" stroke-width="1"/>
      <circle cx="540" cy="560" r="490" stroke-opacity=".035" stroke-width="1"/>
    </g>
    <g fill="none" stroke="#22D3EE">
      <circle cx="300" cy="430" r="120" stroke-opacity=".10" stroke-width="1"/>
      <circle cx="300" cy="430" r="190" stroke-opacity=".06" stroke-width="1"/>
      <circle cx="815" cy="700" r="110" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="815" cy="700" r="180" stroke-opacity=".05" stroke-width="1"/>
    </g>

    <!-- orbital lattice arcs -->
    <g fill="none" stroke-linecap="round">
      <path d="M 120,760 C 320,520 760,520 960,760" stroke="#10B981" stroke-opacity=".28" stroke-width="1.6"/>
      <path d="M 150,820 C 340,620 740,620 930,820" stroke="#10B981" stroke-opacity=".16" stroke-width="1.2"/>
      <path d="M 120,360 C 320,600 760,600 960,360" stroke="#22D3EE" stroke-opacity=".18" stroke-width="1.4"/>
      <path d="M 150,300 C 340,500 740,500 930,300" stroke="#22D3EE" stroke-opacity=".10" stroke-width="1.1"/>
    </g>

    <!-- the ion chain: glowing trapped ions on the axis -->
    <line x1="140" y1="560" x2="940" y2="560" stroke="#34D399" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="2 7"/>
    <g>
      <circle cx="220" cy="560" r="34" fill="url(#ion)"/>
      <circle cx="220" cy="560" r="5.5" fill="#ECFDF5"/>
      <circle cx="380" cy="560" r="46" fill="url(#ion)"/>
      <circle cx="380" cy="560" r="7" fill="#ECFDF5"/>
      <circle cx="540" cy="560" r="64" fill="url(#ion)"/>
      <circle cx="540" cy="560" r="9" fill="#FFFFFF"/>
      <circle cx="700" cy="560" r="46" fill="url(#ionC)"/>
      <circle cx="700" cy="560" r="7" fill="#F0FDFF"/>
      <circle cx="860" cy="560" r="34" fill="url(#ion)"/>
      <circle cx="860" cy="560" r="5.5" fill="#ECFDF5"/>
    </g>
    <!-- entanglement links between ions -->
    <g fill="none" stroke="#34D399" stroke-width="1.3">
      <path d="M 220,560 C 300,480 460,480 540,560" stroke-opacity=".35"/>
      <path d="M 380,560 C 460,640 620,640 700,560" stroke-opacity=".30"/>
      <path d="M 540,560 C 640,470 780,470 860,560" stroke-opacity=".25"/>
      <path d="M 220,560 C 380,700 700,700 860,560" stroke-opacity=".14"/>
    </g>
    <!-- drifting satellite ions (space motif) -->
    <g>
      <circle cx="180" cy="240" r="3" fill="#34D399" fill-opacity=".8"/>
      <circle cx="905" cy="205" r="2.5" fill="#22D3EE" fill-opacity=".8"/>
      <circle cx="965" cy="415" r="2" fill="#34D399" fill-opacity=".6"/>
      <circle cx="115" cy="475" r="2" fill="#22D3EE" fill-opacity=".55"/>
      <circle cx="850" cy="905" r="2.5" fill="#34D399" fill-opacity=".5"/>
      <circle cx="240" cy="890" r="2" fill="#34D399" fill-opacity=".45"/>
    </g>
  </svg>

  <div style="position:absolute;left:90px;top:112px;right:90px">
    <div class="mono" style="font-size:19px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:#34D399">Quantum &middot; Fundamental-Value Walkthrough</div>
  </div>

  <div style="position:absolute;left:90px;right:90px;top:900px">
    <div class="mono" style="font-size:120px;font-weight:600;letter-spacing:.06em;color:#E8EDF2;line-height:1">IONQ</div>
    <div style="font-family:'Fraunces',serif;font-weight:600;font-size:47px;line-height:1.12;letter-spacing:-.015em;color:#E8EDF2;margin-top:26px;max-width:880px">The selloff left a gap<br>the model can see.</div>
  </div>

  <div style="position:absolute;left:90px;right:90px;bottom:64px;display:flex;justify-content:space-between;align-items:baseline">
    <div class="mono" style="font-size:16px;letter-spacing:.2em;font-weight:600;color:#E8EDF2">AI STACK</div>
    <div class="mono" style="font-size:15px;letter-spacing:.1em;color:#8A93A6">2026-07-07 &middot; educational only &mdash; not financial advice</div>
  </div>
</div></body></html>
